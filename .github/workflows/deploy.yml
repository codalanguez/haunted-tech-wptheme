name: Deploy to WordPress

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: rsync to 10Web via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A parse error in a theme file is a white screen on the live site, and
      # there is no PHP binary on the authoring machine to catch it first.
      # ubuntu-latest ships one, so lint here — a failure stops the rsync.
      - name: Lint PHP
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true

      - name: Deploy via rsync
        run: |
          rsync -az --delete --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.THEME_PATH }}/

      - name: Smoke test reader funnel
        run: |
          page="$(mktemp)"
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 \
            --user-agent "Haunted-Tech-Deploy-Check/1.0" \
            "https://codalanguez.com/the-first-sky/?deploy-check=${GITHUB_SHA}" \
            --output "$page"
          grep --fixed-strings 'class="flagship-serial"' "$page"
          grep --fixed-strings 'data-serial-action="start-reading"' "$page"
          grep --fixed-strings 'data-serial-action="episode-read"' "$page"
          grep --fixed-strings 'data-serial-action="follow-substack"' "$page"
          grep --fixed-strings 'data-serial="custodian"' "$page"
          grep --fixed-strings 'href="https://codalanguez.com/start-here/"' "$page"
