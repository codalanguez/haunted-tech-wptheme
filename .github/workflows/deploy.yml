name: Deploy to WordPress

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    name: rsync to 10Web via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A parse error in a theme file is a white screen on the live site, and
      # there is no PHP binary on the authoring machine to catch it first.
      # ubuntu-latest ships one, so lint here — a failure stops the rsync.
      - name: Lint PHP
        run: find . -path ./.git -prune -o -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts || true

      - name: Deploy via rsync
        run: |
          rsync -az --delete --chmod=D755,F644 \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.DS_Store' \
            --exclude='*.log' \
            --exclude='.env' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.THEME_PATH }}/

      - name: Update MechApe sales page
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for candidate in php8.4 php8.3 php8.2 php8.1 php8.0 php; do if command -v \$candidate >/dev/null 2>&1 && \$candidate -r 'exit(PHP_VERSION_ID >= 80000 ? 0 : 1);'; then exec \$candidate '${{ secrets.THEME_PATH }}/scripts/open-mechape-sales.php'; fi; done; echo 'PHP 8 or newer CLI required' >&2; exit 1"

      - name: Update MechApe 2.0.1 and plugin 0.1.10 page
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for candidate in php8.4 php8.3 php8.2 php8.1 php8.0 php; do if command -v \$candidate >/dev/null 2>&1 && \$candidate -r 'exit(PHP_VERSION_ID >= 80000 ? 0 : 1);'; then exec \$candidate '${{ secrets.THEME_PATH }}/scripts/update-mechape-2.0.1.php'; fi; done; echo 'PHP 8 or newer CLI required' >&2; exit 1"

      - name: Refresh links signup cache
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for candidate in php8.4 php8.3 php8.2 php8.1 php8.0 php; do if command -v \$candidate >/dev/null 2>&1 && \$candidate -r 'exit(PHP_VERSION_ID >= 80000 ? 0 : 1);'; then exec \$candidate '${{ secrets.THEME_PATH }}/scripts/refresh-links-signup-cache.php'; fi; done; echo 'PHP 8 or newer CLI required' >&2; exit 1"

      - name: Verify MCP worker guard
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "for candidate in php8.4 php8.3 php8.2 php8.1 php8.0 php; do if command -v \$candidate >/dev/null 2>&1 && \$candidate -r 'exit(PHP_VERSION_ID >= 80000 ? 0 : 1);'; then exec \$candidate '${{ secrets.THEME_PATH }}/scripts/check-mcp-worker-guard.php'; fi; done; echo 'PHP 8 or newer CLI required' >&2; exit 1"

      - name: Smoke test reader funnel
        continue-on-error: true
        timeout-minutes: 1
        run: |
          page="$(mktemp)"
          curl --fail --silent --show-error \
            --retry 1 --retry-all-errors --retry-delay 5 --max-time 15 \
            --user-agent "Haunted-Tech-Deploy-Check/1.0" \
            "https://codalanguez.com/the-first-sky/?deploy-check=${GITHUB_SHA}" \
            --output "$page"
          grep --fixed-strings 'class="flagship-serial"' "$page"
          grep --fixed-strings 'data-serial-action="start-reading"' "$page"
          grep --fixed-strings 'data-serial-action="episode-read"' "$page"
          grep --fixed-strings 'data-serial-action="follow-substack"' "$page"
          grep --fixed-strings 'data-serial="custodian"' "$page"
          grep --fixed-strings 'href="https://codalanguez.com/start-here/"' "$page"

      - name: Smoke test homepage story carousel
        continue-on-error: true
        timeout-minutes: 1
        run: |
          page="$(mktemp)"
          curl --fail --silent --show-error \
            --retry 1 --retry-all-errors --retry-delay 5 --max-time 15 \
            --user-agent "Haunted-Tech-Deploy-Check/1.0" \
            "https://codalanguez.com/?deploy-check=${GITHUB_SHA}" \
            --output "$page"
          grep --fixed-strings 'id="hero-slider"' "$page"
          grep --fixed-strings 'aria-label="Story carousel"' "$page"
          grep --fixed-strings 'data-serial-action="start-reading"' "$page"
